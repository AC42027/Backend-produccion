name: Deploy Backend Producción

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (no escribe en la BD)'
        type: boolean
        default: false
      skip_json:
        description: 'Omitir JSON del frontend (solo auto-match API)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest changes
        run: |
          cd /var/www/html/insp_pry/Backend-produccion
          git fetch origin main
          git reset --hard origin/main

      - name: Replicar config SAP L1P desde el portal (.env)
        run: |
          BE=/var/www/html/insp_pry/Backend-produccion/.env
          PE=/var/www/html/ingenieria/portal_sap/.env
          if [ ! -f "$PE" ]; then
            echo "AVISO: no existe .env del portal ($PE); saltando"
            exit 0
          fi
          get_kv() { local f=$1 k=$2; awk -F= -v k="$k" '$1==k {gsub(/^"|"$/, "", $2); print $2; exit}' "$f"; }
          for pair in "SAP_L1P_HOST|SAP_HOST" "SAP_L1P_SYSNR|SAP_SYSNR" "SAP_L1P_CLIENT|SAP_CLIENT" "SAP_L1P_LANG|SAP_LANG"; do
            key=${pair%%|*}; gen=${pair##*|}
            val=$(get_kv "$PE" "$key")
            if [ -z "$val" ]; then val=$(get_kv "$PE" "$gen"); fi
            if [ -z "$val" ]; then
              echo "AVISO: $key sin valor en el portal"
              continue
            fi
            if grep -q "^${key}=" "$BE" 2>/dev/null; then
              echo "OK (ya existe): $key"
            else
              echo "${key}=${val}" >> "$BE"
              echo "OK (agregada): $key=${val}"
            fi
          done

      - name: Install dependencies
        run: |
          cd /var/www/html/insp_pry/Backend-produccion
          # SDK SAP NW RFC. Necesario para pyrfc.
          if [ -d /home/ac42027/nwrfcsdk ]; then
            export SAPNWRFC_HOME=/home/ac42027/nwrfcsdk
            export LD_LIBRARY_PATH=$SAPNWRFC_HOME/lib:${LD_LIBRARY_PATH:-}
          elif [ -d /usr/local/sap/nwrfcsdk ]; then
            export SAPNWRFC_HOME=/usr/local/sap/nwrfcsdk
            export LD_LIBRARY_PATH=$SAPNWRFC_HOME/lib:${LD_LIBRARY_PATH:-}
          fi
          ./venv/bin/pip install -r requirements.txt

      - name: Run Database Migrations
        run: |
          cd /var/www/html/insp_pry/Backend-produccion
          ./venv/bin/python manage.py migrate

      - name: Collect Static Files
        run: |
          cd /var/www/html/insp_pry/Backend-produccion
          ./venv/bin/python manage.py collectstatic --noinput

      - name: Restart Backend Service
        run: |
          sudo systemctl restart inspecciones.service

      - name: Diagnostico pyRFC (cada deploy, sin secretos en Git)
        run: |
          cd /var/www/html/insp_pry/Backend-produccion
          export SAPNWRFC_HOME=/home/ac42027/nwrfcsdk 2>/dev/null || true
          export LD_LIBRARY_PATH=$SAPNWRFC_HOME/lib:${LD_LIBRARY_PATH:-}
          set +e
          echo "=== systemctl cat inspecciones.service ==="
          sudo systemctl cat inspecciones.service 2>&1 | head -60
          echo "=== prueba pyrfc (secret vs .env) ==="
          ./venv/bin/python - <<'PY' 2>&1
          import os, sys
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'mi_formulario.settings')
          import django; django.setup()
          from decouple import config
          from inspeccion.sap_pyrfc import _conexion, SapRfcError

          creds = [
              ("SECRET", config('SAP_USER', default='ac17157'), os.environ.get('LDAP_TEST_PASS', '')),
              ("ENV",    config('SAP_USER', default='ac17157'), config('SAP_PASS', default='')),
          ]
          for label, user, pwd in creds:
              if not pwd:
                  print(f"[{label}] sin password, omito")
                  continue
              try:
                  conn = _conexion(user, pwd, 'L1P')
                  print(f"[{label}] CONEXION OK ({user})")
                  try:
                      res = conn.call('RFC_READ_TABLE', QUERY_TABLE='QMEL',
                                      FIELDS=[{'FIELDNAME': 'OBJNR'}, {'FIELDNAME': 'QMTXT'}],
                                      OPTIONS=[{'TEXT': "QMNUM = '000007601193'"}], DELIMITER='|')
                      print(f"[{label}] CALL OK rows=", len(res.get('DATA') or []))
                      for row in (res.get('DATA') or [])[:3]:
                          print("   ROW:", repr(row))
                  except Exception as e:
                      print(f"[{label}] CALL-ERROR:", type(e).__name__, e)
                  finally:
                      conn.close()
              except SapRfcError as e:
                  print(f"[{label}] SAPRFC-ERROR:", e)
              except Exception as e:
                  print(f"[{label}] PY-ERROR:", type(e).__name__, e)
          PY
          echo "EXIT_CODE=$?"
          set -e
        env:
          LDAP_TEST_PASS: ${{ secrets.LDAP_TEST_PASS }}

      - name: Backfill SAP (solo manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd /var/www/html/insp_pry/Backend-produccion
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          if [ "${{ inputs.skip_json }}" = "true" ]; then
            ./venv/bin/python manage.py backfill_sap --skip-json $ARGS
          else
            curl -fsSL -o /tmp/django_to_sap_map.json https://raw.githubusercontent.com/AC42027/Frontend-formulario-produccion/main/falcon/django_to_sap_map.json
            ./venv/bin/python manage.py backfill_sap --json /tmp/django_to_sap_map.json $ARGS
          fi
