name: Deploy Backend Producción

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (no escribe en la BD)'
        type: boolean
        default: false
      skip_json:
        description: 'Omitir JSON del frontend (solo auto-match API)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest changes
        run: |
          cd /var/www/html/insp_pry/Backend-produccion
          git fetch origin main
          git reset --hard origin/main

      - name: Replicar config SAP L1P desde el portal (.env)
        run: |
          BE=/var/www/html/insp_pry/Backend-produccion/.env
          PE=/var/www/html/ingenieria/portal_sap/.env
          if [ ! -f "$PE" ]; then
            echo "AVISO: no existe .env del portal ($PE); saltando"
            exit 0
          fi
          get_kv() { local f=$1 k=$2; awk -F= -v k="$k" '$1==k {gsub(/^"|"$/, "", $2); print $2; exit}' "$f"; }
          for pair in "SAP_L1P_HOST|SAP_HOST" "SAP_L1P_SYSNR|SAP_SYSNR" "SAP_L1P_CLIENT|SAP_CLIENT" "SAP_L1P_LANG|SAP_LANG"; do
            key=${pair%%|*}; gen=${pair##*|}
            val=$(get_kv "$PE" "$key")
            if [ -z "$val" ]; then val=$(get_kv "$PE" "$gen"); fi
            if [ -z "$val" ]; then
              echo "AVISO: $key sin valor en el portal"
              continue
            fi
            if grep -q "^${key}=" "$BE" 2>/dev/null; then
              echo "OK (ya existe): $key"
            else
              echo "${key}=${val}" >> "$BE"
              echo "OK (agregada): $key=${val}"
            fi
          done

      - name: Install dependencies
        run: |
          cd /var/www/html/insp_pry/Backend-produccion
          # SDK SAP NW RFC. Necesario para pyrfc.
          if [ -d /home/ac42027/nwrfcsdk ]; then
            export SAPNWRFC_HOME=/home/ac42027/nwrfcsdk
            export LD_LIBRARY_PATH=$SAPNWRFC_HOME/lib:${LD_LIBRARY_PATH:-}
          elif [ -d /usr/local/sap/nwrfcsdk ]; then
            export SAPNWRFC_HOME=/usr/local/sap/nwrfcsdk
            export LD_LIBRARY_PATH=$SAPNWRFC_HOME/lib:${LD_LIBRARY_PATH:-}
          fi
          ./venv/bin/pip install -r requirements.txt

      - name: Run Database Migrations
        run: |
          cd /var/www/html/insp_pry/Backend-produccion
          ./venv/bin/python manage.py migrate

      - name: Collect Static Files
        run: |
          cd /var/www/html/insp_pry/Backend-produccion
          ./venv/bin/python manage.py collectstatic --noinput

      - name: Configurar env SDK SAP para el servicio
        run: |
          cd /var/www/html/insp_pry/Backend-produccion
          if [ -d /home/ac42027/nwrfcsdk/lib ]; then
            SDK=/home/ac42027/nwrfcsdk
          elif [ -d /usr/local/sap/nwrfcsdk/lib ]; then
            SDK=/usr/local/sap/nwrfcsdk
          else
            echo "ERROR: no se encontró el SDK SAP NW RFC (lib)"; exit 1
          fi
          BIN=./venv/bin
          if [ -f "$BIN/uvicorn.bin" ]; then
            echo "uvicorn.bin ya existe (respaldo previo)"
          else
            cp "$BIN/uvicorn" "$BIN/uvicorn.bin"
            echo "Backup uvicorn -> uvicorn.bin"
          fi
          if [ -L "$BIN/uvicorn" ]; then rm "$BIN/uvicorn"; fi
          ABSDIR=$(cd "$(dirname "$BIN/uvicorn")" && pwd)
          if [ -x "$ABSDIR/python3.11" ]; then PY="$ABSDIR/python3.11";
          elif [ -x "$ABSDIR/python3" ]; then PY="$ABSDIR/python3";
          elif [ -x "$ABSDIR/python" ]; then PY="$ABSDIR/python";
          else echo "ERROR: no hay intérprete python en $ABSDIR"; exit 1; fi
          cat > "$BIN/uvicorn" <<EOW
          #!/bin/bash
          # Wrapper generado por deploy workflow - inyecta el SDK SAP NW RFC
          export SAPNWRFC_HOME="$SDK"
          export LD_LIBRARY_PATH="$SDK/lib:\${LD_LIBRARY_PATH:-}"
          exec "$PY" -m uvicorn "\$@"
          EOW
          chmod +x "$BIN/uvicorn"
          echo "OK: wrapper uvicorn generado con SDK=$SDK PY=$PY"
          "$BIN/uvicorn" --version 2>&1 | head -2
          ls -la "$BIN/uvicorn" "$BIN/uvicorn.bin"

      - name: Restart Backend Service
        run: |
          sudo systemctl restart inspecciones.service

      - name: Diagnostico pyRFC (cada deploy, sin secretos en Git)
        run: |
          cd /var/www/html/insp_pry/Backend-produccion
          export SAPNWRFC_HOME=/home/ac42027/nwrfcsdk 2>/dev/null || true
          export LD_LIBRARY_PATH=$SAPNWRFC_HOME/lib:${LD_LIBRARY_PATH:-}
          set +e
          echo "=== ExecStart (systemctl show) ==="
          sudo systemctl show inspecciones -p ExecStart 2>&1 || true
          echo "=== ps gunicorn ==="
          ps aux | grep -i gunicorn | grep -v grep || true
          echo "=== unit file ==="
          cat /etc/systemd/system/inspecciones.service 2>/dev/null || sudo cat /etc/systemd/system/inspecciones.service 2>/dev/null || true
          echo "=== gunicorn.conf ==="
          cat gunicorn.conf.py 2>/dev/null || true
          echo "=== journal reciente (crashes) ==="
          sudo journalctl -u inspecciones -n 40 --no-pager 2>&1 | tail -40 || true
          echo "=== smoke test endpoint (uvicorn threads) ==="
          cat > /tmp/smoke.py <<'PY'
          import json, urllib.request, time, sys
          body = json.dumps({"avisos": ["000211579207"], "username": "ac17157",
                             "password": $SMOKE_PASS_JSON}).encode()
          req = urllib.request.Request("http://127.0.0.1:8080/api/sap/avisos/status/",
                                       data=body, headers={"Content-Type": "application/json"})
          try:
              t0 = time.time()
              with urllib.request.urlopen(req, timeout=120) as r:
                  print("HTTP", r.status, "t=", round(time.time()-t0,2), r.read().decode()[:500])
          except urllib.error.HTTPError as e:
              print("HTTP-ERROR", e.code, "t=", round(time.time()-t0,2), e.read().decode()[:500])
          except Exception as e:
              print("NET-ERROR", type(e).__name__, e, "t=", round(time.time()-t0,2))
          PY
          sed -i "s/\$SMOKE_PASS_JSON/'$(printf '%s' "$LDAP_TEST_PASS" | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read()))')'/g" /tmp/smoke.py
          ./venv/bin/python /tmp/smoke.py
          echo "--- status tras smoke ---"
          sudo systemctl is-active inspecciones
          echo "--- journal tras smoke (ultimos) ---"
          sudo journalctl -u inspecciones -n 25 --no-pager 2>&1 | tail -25 || true
          echo "=== prueba pyrfc: usuario ac17157 + formatos OPTIONS ==="
          echo "--- import pyrfc SIMULANDO el servicio (sin LD_LIBRARY_PATH) ---"
          env -u LD_LIBRARY_PATH -u SAPNWRFC_HOME ./venv/bin/python - <<'PY' 2>&1
          import os, ctypes, glob
          print("cwd ->", os.getcwd())
          from decouple import config
          print("config SAPNWRFC_HOME ->", repr(config('SAPNWRFC_HOME', default='')))
          print("env  SAPNWRFC_HOME ->", repr(os.environ.get('SAPNWRFC_HOME', '')))
          for base in ('/home/ac42027/nwrfcsdk', '/usr/local/sap/nwrfcsdk', '/opt/sap/nwrfcsdk'):
              print(f"candidate {base}: isdir_lib={os.path.isdir(os.path.join(base,'lib'))} libs=", glob.glob(os.path.join(base,'lib','libsapnwrfc*')))
          # intentar import del sub-modulo nativo para ver el error real
          try:
              import pyrfc._cyrfc as c
              print("_cyrfc OK ->", c)
              print("_cyrfc has Connection ->", hasattr(c, 'Connection'))
          except Exception as e:
              print("_cyrfc FAIL ->", type(e).__name__, e)
          import pyrfc
          print("pyrfc dir ->", [x for x in dir(pyrfc) if not x.startswith('_')])
          print("pyrfc file ->", pyrfc.__file__)
          try:
              print(open(pyrfc.__file__).read()[:800])
          except Exception:
              pass
          PY
          ./venv/bin/python - <<'PY' 2>&1
          import os, sys
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'mi_formulario.settings')
          import django; django.setup()
          from inspeccion.sap_pyrfc import _conexion, SapRfcError

          user = 'ac17157'
          pwd  = os.environ.get('LDAP_TEST_PASS', '')
          if not pwd:
              print("sin password en secret, aborto"); sys.exit(0)
          try:
              conn = _conexion(user, pwd, 'L1P')
              print(f"CONEXION OK ({user})")
              import pyrfc
              print("pyrfc:", getattr(pyrfc, '__version__', '?'))
              def probe(tag, qtable, fields, options, rowcount=None):
                  try:
                      kw = dict(QUERY_TABLE=qtable, FIELDS=fields, OPTIONS=options, DELIMITER='|')
                      if rowcount: kw['ROWCOUNT'] = rowcount
                      res = conn.call('RFC_READ_TABLE', **kw)
                      data = res.get('DATA') or []
                      print(f"  [{tag}] rows={len(data)}")
                      for row in data[:4]:
                          print("     ROW:", repr(row))
                  except Exception as e:
                      print(f"  [{tag}] ERROR:", type(e).__name__, e)
              # formato TEXT (como JSP)
              probe("TEXT QMEL 7601193", 'QMEL',
                    [{'FIELDNAME':'OBJNR'},{'FIELDNAME':'QMTXT'},{'FIELDNAME':'AUFNR'}],
                    [{'TEXT': "QMNUM = '000007601193'"}])
              # formato SIGN/OPTION/LOW
              probe("SIGN QMEL 7601193", 'QMEL',
                    [{'FIELDNAME':'OBJNR'},{'FIELDNAME':'QMTXT'},{'FIELDNAME':'AUFNR'}],
                    [{'SIGN':'I','OPTION':'EQ','LOW':'000007601193'}])
              # sin filtro (permisos?)
              probe("SIGN QMEL top5", 'QMEL',
                    [{'FIELDNAME':'QMNUM'},{'FIELDNAME':'QMTXT'}],
                    [], rowcount=5)
              conn.close()
          except SapRfcError as e:
              print("SAPRFC-ERROR:", e)
          except Exception as e:
              print("PY-ERROR:", type(e).__name__, e)
          PY
          echo "EXIT_CODE=$?"
          set -e
        env:
          LDAP_TEST_PASS: ${{ secrets.LDAP_TEST_PASS }}

      - name: Backfill SAP (solo manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd /var/www/html/insp_pry/Backend-produccion
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          if [ "${{ inputs.skip_json }}" = "true" ]; then
            ./venv/bin/python manage.py backfill_sap --skip-json $ARGS
          else
            curl -fsSL -o /tmp/django_to_sap_map.json https://raw.githubusercontent.com/AC42027/Frontend-formulario-produccion/main/falcon/django_to_sap_map.json
            ./venv/bin/python manage.py backfill_sap --json /tmp/django_to_sap_map.json $ARGS
          fi
